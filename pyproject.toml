[project]
name = "finance-controller"
version = "0.1.0"
description = "AI Finance Controller - multi-source financial reconciliation agent (Razorpay Buildathon Track 04)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "huggingface_hub>=0.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "httpx>=0.27",
    "openai>=1.50",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data/raw"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests", "api/tests"]
pythonpath = ["."]
